<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 44" fill="none">
  <!-- büyük blok — sol üst -->
  <rect x="2" y="2" width="22" height="14" fill="#1a1a18" opacity="0.92"/>
  <!-- küçük kare — sağ üst -->
  <rect x="28" y="2" width="14" height="14" fill="none" stroke="#1a1a18" stroke-width="1.4"/>
  <!-- ince yatay şerit — sol alt, accent rengi -->
  <rect x="2" y="22" width="14" height="5" fill="#c8b89a"/>
  <!-- orta boy blok — sağ alt -->
  <rect x="20" y="20" width="22" height="22" fill="none" stroke="#1a1a18" stroke-width="1.4"/>
  <!-- küçük nokta aksan — sol en alt -->
  <rect x="2" y="32" width="8" height="10" fill="#1a1a18" opacity="0.35"/>
</svg>
