# Hanuja — Production Docker Compose
#
# Runs the full stack: 3 Next.js apps + BullMQ worker + PostgreSQL + Redis + Meilisearch.
# Intended for staging smoke tests and as a reference for Coolify service configuration.
#
# Usage:
#   docker compose -f docker-compose.production.yml --env-file .env up --build -d
#
# Prerequisites:
#   - .env file with all required variables (see .env.example)
#   - DATABASE_URL must point to the postgres service: postgresql://hanuja:<pass>@postgres:5432/hanuja
#   - REDIS_URL must point to the redis service: redis://redis:6379
#   - MEILISEARCH_URL must point to the meilisearch service: http://meilisearch:7700

services:
  # ── Infrastructure ────────────────────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: hanuja_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hanuja
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hanuja_prod_password}
      POSTGRES_DB: hanuja
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U hanuja -d hanuja']
      interval: 10s
      timeout: 5s
      retries: 5
    # Postgres is internal — no public port in production

  redis:
    image: redis:7-alpine
    container_name: hanuja_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: hanuja_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILISEARCH_ADMIN_KEY}
      MEILI_ENV: production
    volumes:
      - meilisearch_data:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Applications ─────────────────────────────────────────────────────────

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: hanuja_web
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hanuja:${POSTGRES_PASSWORD:-hanuja_prod_password}@postgres:5432/hanuja
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  seller-panel:
    build:
      context: .
      dockerfile: Dockerfile.seller-panel
    container_name: hanuja_seller_panel
    restart: unless-stopped
    ports:
      - '3001:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hanuja:${POSTGRES_PASSWORD:-hanuja_prod_password}@postgres:5432/hanuja
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      BETTER_AUTH_URL: ${SELLER_PANEL_URL:-http://localhost:3001}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  admin-panel:
    build:
      context: .
      dockerfile: Dockerfile.admin-panel
    container_name: hanuja_admin_panel
    restart: unless-stopped
    ports:
      - '3002:3002'
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hanuja:${POSTGRES_PASSWORD:-hanuja_prod_password}@postgres:5432/hanuja
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
      BETTER_AUTH_URL: ${ADMIN_PANEL_URL:-http://localhost:3002}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3002/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: hanuja_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://hanuja:${POSTGRES_PASSWORD:-hanuja_prod_password}@postgres:5432/hanuja
      REDIS_URL: redis://redis:6379
      MEILISEARCH_URL: http://meilisearch:7700
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  meilisearch_data:
